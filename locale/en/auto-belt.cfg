[mod-setting-description]
auto-belt-allow-free=When off, routes can only be built as ghosts.
auto-belt-search-budget=Work units spent on route searches each tick, shared by all players. Higher finds routes faster but costs more time per tick.
auto-belt-build-batch=How many belts and undergrounds are placed each tick while a route is built.
auto-belt-max-effort=A search that spends more work units than this gives up.

